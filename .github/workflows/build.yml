name: Build

on:
  push:
    branches: ["*"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ qt6-base-dev libqt6sql6-sqlite \
            libssl-dev libgl1-mesa-dev file imagemagick

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin \
            AppDir/usr/share/applications \
            AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/src/client/chatter AppDir/usr/bin/
          cp build/src/server/chatter-server AppDir/usr/bin/
          cp packaging/nullchat.png AppDir/usr/share/icons/hicolor/256x256/apps/nullchat.png
          cp packaging/nullchat.png AppDir/nullchat.png
          ln -sf nullchat.png AppDir/.DirIcon
          cat > AppDir/nullchat.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Nullchat
          Comment=Encrypted terminal-style chat
          Exec=chatter
          Icon=nullchat
          Terminal=false
          Categories=Network;InstantMessaging;
          EOF
          cp AppDir/nullchat.desktop AppDir/usr/share/applications/
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
          mv Nullchat-*.AppImage Nullchat-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Nullchat-Linux
          path: Nullchat-x86_64.AppImage

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        run: choco install -y --no-progress qt6-base

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="C:\Qt\6.7.0\msvc2022_64"

      - name: Build
        run: cmake --build build -j --config Release

      - name: Deploy Qt DLLs
        run: windeployqt build\src\client\Release\chatter.exe

      - name: Create NSIS installer
        run: |
          choco install -y --no-progress nsis
          makensis packaging\installer.nsi

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Nullchat-Windows
          path: Nullchat-Setup.exe

  release:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Nullchat-Linux
      - uses: actions/download-artifact@v4
        with:
          name: Nullchat-Windows
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Nullchat-x86_64.AppImage
            Nullchat-Setup.exe
          generate_release_notes: true
