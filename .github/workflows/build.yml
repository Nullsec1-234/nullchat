name: Build

on:
  push:
    branches: ["*"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ qt6-base-dev libqt6sql6-sqlite \
            libssl-dev libgl1-mesa-dev file imagemagick

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin \
            AppDir/usr/share/applications \
            AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/src/client/chatter AppDir/usr/bin/
          cp build/src/server/chatter-server AppDir/usr/bin/
          cp packaging/nullchat.png AppDir/usr/share/icons/hicolor/256x256/apps/nullchat.png
          cp packaging/nullchat.png AppDir/nullchat.png
          ln -sf nullchat.png AppDir/.DirIcon
          cat > AppDir/nullchat.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Nullchat
          Comment=Encrypted terminal-style chat
          Exec=chatter
          Icon=nullchat
          Terminal=false
          Categories=Network;InstantMessaging;
          EOF
          cp AppDir/nullchat.desktop AppDir/usr/share/applications/
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
          ls -la Nullchat*.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Nullchat-Linux
          path: Nullchat-x86_64.AppImage

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-nsis

      - name: Configure
        shell: msys2 {0}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build
        shell: msys2 {0}
        run: cmake --build build -j

      - name: Deploy Qt DLLs
        shell: msys2 {0}
        run: windeployqt --release build/src/client/chatter.exe

      - name: Package zip
        shell: pwsh
        run: |
          mkdir Nullchat-Win64
          cp build/src/client/chatter.exe Nullchat-Win64/
          cp build/src/server/chatter-server.exe Nullchat-Win64/
          Get-ChildItem build/src/client/*.dll | Copy-Item -Destination Nullchat-Win64/
          if (Test-Path build/src/client/platforms) {
            Copy-Item -Recurse build/src/client/platforms Nullchat-Win64/
          }
          if (Test-Path build/src/client/sqldrivers) {
            Copy-Item -Recurse build/src/client/sqldrivers Nullchat-Win64/
          }
          if (Test-Path build/src/client/styles) {
            Copy-Item -Recurse build/src/client/styles Nullchat-Win64/
          }
          if (Test-Path build/src/client/imageformats) {
            Copy-Item -Recurse build/src/client/imageformats Nullchat-Win64/
          }
          cp nullchat.example.json Nullchat-Win64/
          Compress-Archive -Path Nullchat-Win64 -DestinationPath Nullchat-Win64.zip

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: Nullchat-Windows
          path: Nullchat-Win64.zip

  release:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Nullchat-Linux
      - uses: actions/download-artifact@v4
        with:
          name: Nullchat-Windows
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Nullchat-x86_64.AppImage
            Nullchat-Win64.zip
          generate_release_notes: true
